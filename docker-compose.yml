services:
  neo4j:
    image: neo4j:2026.06.0
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-memorygraph-local}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - memorygraph-neo4j:/data

volumes:
  memorygraph-neo4j:
