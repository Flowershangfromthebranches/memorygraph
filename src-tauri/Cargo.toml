[package]
name = "memorygraph-atlas"
version = "0.1.0"
description = "MemoryGraph Atlas desktop console"
authors = ["MemoryGraph contributors"]
edition = "2021"

[lib]
name = "memorygraph_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

